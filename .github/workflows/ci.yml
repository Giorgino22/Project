# Runs all checks of ALL sites (apps/*) on every push. A green check mark on GitHub means:
# the code type-checks, all unit tests pass, and every tool works in a real browser.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04, not "ubuntu-latest": since October 2026 "latest" is Ubuntu 26.04, where Playwright
    # 1.56 can't install its browser. Move on together with a Playwright update.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep test traces when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/*/test-results/
          retention-days: 7
